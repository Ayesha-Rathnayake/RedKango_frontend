<!-- OPEN CHAT BUTTON -->
<button *ngIf="!isChatOpen" (click)="toggleChat()" class="fixed bottom-5 right-5 z-50">
  <div
    class="w-14 h-14 rounded-full bg-gradient-to-br from-green-700 to-green-900 shadow-2xl flex items-center justify-center hover:scale-105 transition-all duration-300 border-4 border-white"
  >
    <i class="fa-solid fa-comments text-white text-xl"></i>
  </div>
</button>

<!-- CHAT WINDOW -->
<div
  *ngIf="isChatOpen"
  class="fixed bottom-5 right-5 w-[350px] h-[540px] bg-white rounded-[24px] shadow-2xl overflow-hidden flex flex-col z-50 border border-gray-200"
>
  <!-- HEADER -->
  <div class="bg-gradient-to-r from-green-800 to-green-600 px-4 py-3 text-white">
    <div class="flex items-center justify-between">
      <!-- LEFT -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
          <i class="fa-solid fa-campground text-lg"></i>
        </div>

        <div>
          <h2 class="font-semibold text-lg leading-none">Red Kango AI</h2>

          <p class="text-xs opacity-80 mt-1">Camping Assistant</p>
        </div>
      </div>

      <!-- CLOSE -->
      <button (click)="toggleChat()" class="w-8 h-8 rounded-full hover:bg-white/20 transition">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <!-- MESSAGES -->
  <div #messagesContainer class="flex-1 overflow-y-auto px-4 py-4 bg-[#f7f7f7] space-y-4">
    <!-- EMPTY STATE -->
    <div
      *ngIf="messages.length === 0"
      class="h-full flex flex-col items-center justify-center text-center"
    >
      <div class="w-20 h-20 rounded-full bg-green-100 flex items-center justify-center mb-4">
        <i class="fa-solid fa-tent text-green-700 text-3xl"></i>
      </div>

      <h3 class="text-xl font-semibold text-gray-800">Welcome to Red Kango</h3>

      <p class="text-gray-500 text-sm mt-2 max-w-[220px] leading-6">
        Ask about camping tents, rentals and adventures.
      </p>

      <!-- SUGGESTIONS -->
      <div class="mt-6 flex flex-wrap gap-2 justify-center">
        <button
          class="bg-white px-3 py-2 rounded-full shadow-sm text-xs text-gray-700 hover:bg-green-50 transition"
        >
          Best tents?
        </button>

        <button
          class="bg-white px-3 py-2 rounded-full shadow-sm text-xs text-gray-700 hover:bg-green-50 transition"
        >
          Camping tips
        </button>

        <button
          class="bg-white px-3 py-2 rounded-full shadow-sm text-xs text-gray-700 hover:bg-green-50 transition"
        >
          Family tents
        </button>
      </div>
    </div>

    <!-- CHAT MESSAGES -->
    <div
      *ngFor="let msg of messages"
      class="flex"
      [ngClass]="msg.role === 'user' ? 'justify-end' : 'justify-start'"
    >
      <!-- BOT -->
      <div *ngIf="msg.role === 'bot'" class="flex items-end gap-2 max-w-[85%]">
        <!-- AVATAR -->
        <div class="w-8 h-8 rounded-full bg-green-700 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-tree text-white text-xs"></i>
        </div>

        <!-- MESSAGE -->
        <div class="bg-white px-4 py-3 rounded-2xl rounded-bl-sm shadow-sm border border-gray-100">
          <div class="text-[13px] leading-6 text-gray-700" [innerHTML]="msg.text"></div>

          <div class="text-[10px] text-gray-400 mt-1">
            {{ msg.timestamp | date: 'shortTime' }}
          </div>
        </div>
      </div>

      <!-- USER -->
      <div
        *ngIf="msg.role === 'user'"
        class="bg-green-700 text-white px-4 py-3 rounded-2xl rounded-br-sm max-w-[80%] shadow-sm"
      >
        <p class="text-[13px] leading-6 whitespace-pre-wrap">
          {{ msg.text }}
        </p>

        <div class="text-[10px] text-green-100 mt-1 text-right">
          {{ msg.timestamp | date: 'shortTime' }}
        </div>
      </div>
    </div>

    <!-- LOADING -->
    <div *ngIf="isLoading" class="flex items-end gap-2">
      <div class="w-8 h-8 rounded-full bg-green-700 flex items-center justify-center shadow-sm">
        <i class="fa-solid fa-tree text-white text-xs"></i>
      </div>

      <div class="bg-white px-4 py-3 rounded-2xl rounded-bl-sm shadow-sm border">
        <div class="flex gap-1">
          <span class="w-2 h-2 rounded-full bg-green-400 animate-bounce"> </span>

          <span class="w-2 h-2 rounded-full bg-green-500 animate-bounce delay-150"> </span>

          <span class="w-2 h-2 rounded-full bg-green-600 animate-bounce delay-300"> </span>
        </div>
      </div>
    </div>
  </div>

  <!-- INPUT -->
  <div class="p-3 bg-white border-t border-gray-100">
    <form (submit)="sendMessage($event)" class="flex items-center gap-2">
      <!-- INPUT -->
      <div class="flex-1 relative">
        <input
          [(ngModel)]="userInput"
          name="message"
          type="text"
          placeholder="Ask about camping..."
          class="w-full bg-gray-100 rounded-full py-3 pl-4 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-green-600"
          [disabled]="isLoading"
        />
      </div>

      <!-- SEND -->
      <button
        type="submit"
        [disabled]="!userInput.trim() || isLoading"
        class="w-11 h-11 rounded-full bg-green-700 text-white shadow hover:bg-green-800 transition disabled:opacity-50"
      >
        <i class="fa-solid fa-paper-plane text-sm"></i>
      </button>
    </form>
  </div>
</div>

<!-- MOBILE OVERLAY -->
<div
  *ngIf="isChatOpen"
  (click)="toggleChat()"
  class="fixed inset-0 bg-black/20 z-40 md:hidden"
></div>
