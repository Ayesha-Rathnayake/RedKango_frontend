<header
  class="bg-white/95 backdrop-blur-md shadow-sm fixed top-0 left-0 w-full z-50 border-b border-gray-100"
>
  <div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-3">
    <!-- LOGO -->
    <a routerLink="/" class="flex items-center">
      <img src="images/logo1.png" alt="Red Kango Logo" class="h-14 w-auto" />
    </a>

    <!-- DESKTOP NAV -->
    <nav class="hidden md:flex items-center gap-8 text-sm font-semibold">
      <a
        routerLink="/"
        routerLinkActive="text-green-700"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-gray-800 hover:text-green-700 transition"
      >
        Home
      </a>

      <a
        routerLink="/rentals"
        routerLinkActive="text-green-700"
        class="text-gray-800 hover:text-green-700 transition"
      >
        Rentals
      </a>

      <a
        routerLink="/shop"
        routerLinkActive="text-green-700"
        class="text-gray-800 hover:text-green-700 transition"
      >
        Shop
      </a>

      <a
        routerLink="/camping-tips"
        routerLinkActive="text-green-700"
        class="text-gray-800 hover:text-green-700 transition"
      >
        Camping Tips
      </a>

      <a
        routerLink="/reviews"
        routerLinkActive="text-green-700"
        class="text-gray-800 hover:text-green-700 transition"
      >
        Reviews
      </a>
    </nav>

    <!-- RIGHT SIDE -->
    <div class="hidden md:flex items-center gap-4">
      <!-- GUEST -->
      <div *ngIf="!isLoggedIn" class="flex items-center gap-3">
        <a
          routerLink="/login"
          class="px-5 py-2 border border-green-700 text-green-700 rounded-lg text-sm font-semibold hover:bg-green-50 transition"
        >
          Login
        </a>

        <a
          routerLink="/signup"
          class="px-5 py-2 bg-green-700 text-white rounded-lg text-sm font-semibold hover:bg-green-800 transition"
        >
          Sign Up
        </a>
      </div>

      <!-- LOGGED USER -->
      <div *ngIf="isLoggedIn" class="flex items-center gap-3">
        <!-- CART DROPDOWN -->
        <div class="relative">
          <button
            type="button"
            (click)="toggleCart()"
            class="relative w-11 h-11 rounded-full hover:bg-green-50 flex items-center justify-center transition"
          >
            <i class="fas fa-shopping-cart text-gray-700 text-lg"></i>

            <span
              *ngIf="cartCount > 0"
              class="absolute -top-1 -right-1 bg-red-500 text-white text-[11px] min-w-5 h-5 px-1 rounded-full flex items-center justify-center font-bold"
            >
              {{ cartCount }}
            </span>
          </button>

          <div
            *ngIf="cartOpen"
            class="absolute right-0 mt-3 w-72 bg-white border border-gray-100 rounded-2xl shadow-xl z-50 overflow-hidden"
          >
            <div class="px-4 py-3 border-b bg-gray-50">
              <h3 class="text-sm font-bold text-gray-900">Your Carts</h3>
              <p class="text-xs text-gray-500 mt-0.5">
                Purchases and rentals are managed separately.
              </p>
            </div>

            <button
              type="button"
              (click)="goToPurchaseCart()"
              class="w-full flex items-center gap-3 px-4 py-4 hover:bg-green-50 transition text-left"
            >
              <div class="w-10 h-10 rounded-xl bg-green-100 flex items-center justify-center">
                <i class="fas fa-shopping-bag text-green-700"></i>
              </div>

              <div class="flex-1">
                <p class="text-sm font-semibold text-gray-900">Purchase Cart</p>
                <p class="text-xs text-gray-500">
                  {{ purchaseCartCount }} item{{ purchaseCartCount === 1 ? '' : 's' }}
                </p>
              </div>

              <i class="fas fa-chevron-right text-xs text-gray-400"></i>
            </button>

            <button
              type="button"
              (click)="goToRentalCart()"
              class="w-full flex items-center gap-3 px-4 py-4 hover:bg-green-50 transition text-left"
            >
              <div class="w-10 h-10 rounded-xl bg-green-100 flex items-center justify-center">
                <i class="fas fa-campground text-green-700"></i>
              </div>

              <div class="flex-1">
                <p class="text-sm font-semibold text-gray-900">Rental Cart</p>
                <p class="text-xs text-gray-500">
                  {{ rentalCartCount }} item{{ rentalCartCount === 1 ? '' : 's' }}
                </p>
              </div>

              <i class="fas fa-chevron-right text-xs text-gray-400"></i>
            </button>
          </div>
        </div>

        <!-- PROFILE -->
        <div class="relative">
          <button
            type="button"
            (click)="toggleProfile()"
            class="w-11 h-11 rounded-full hover:bg-green-50 flex items-center justify-center transition"
          >
            <i class="fas fa-user-circle text-gray-700 text-2xl"></i>
          </button>

          <div
            *ngIf="profileOpen"
            class="absolute right-0 mt-3 w-52 bg-white border border-gray-100 rounded-2xl shadow-xl py-2 z-50"
          >
            <a
              routerLink="/customer"
              (click)="profileOpen = false"
              class="flex items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-green-50 transition"
            >
              <i class="fas fa-user text-green-700 w-4"></i>
              My Profile
            </a>
            <a
              routerLink="/customer/orders"
              (click)="profileOpen = false"
              class="flex items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-green-50 transition"
            >
              <i class="fas fa-box text-green-700 w-4"></i>
              My Orders
            </a>
            <a
              routerLink="/customer/rentals"
              (click)="profileOpen = false"
              class="flex items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-green-50 transition"
            >
              <i class="fas fa-campground text-green-700 w-4"></i>
              My Rentals
            </a>

            <button
              type="button"
              (click)="onLogout()"
              class="w-full flex items-center gap-3 px-4 py-3 text-sm text-red-600 hover:bg-red-50 transition text-left"
            >
              <i class="fas fa-sign-out-alt w-4"></i>
              Logout
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- MOBILE MENU BUTTON -->
    <button
      type="button"
      class="md:hidden w-10 h-10 rounded-lg text-green-700 hover:bg-green-50 transition"
      (click)="toggleMenu()"
    >
      <i class="fas" [ngClass]="menuOpen ? 'fa-times' : 'fa-bars'"></i>
    </button>
  </div>

  <!-- MOBILE MENU -->
  <div *ngIf="menuOpen" class="md:hidden bg-white border-t border-gray-100 px-6 py-4 space-y-3">
    <a routerLink="/" (click)="toggleMenu()" class="block text-sm font-semibold">Home</a>
    <a routerLink="/rentals" (click)="toggleMenu()" class="block text-sm font-semibold">Rentals</a>
    <a routerLink="/shop" (click)="toggleMenu()" class="block text-sm font-semibold">Shop</a>
    <a routerLink="/camping-tips" (click)="toggleMenu()" class="block text-sm font-semibold"
      >Camping Tips</a
    >
    <a routerLink="/reviews" (click)="toggleMenu()" class="block text-sm font-semibold">Reviews</a>

    <div class="pt-4 border-t space-y-2" *ngIf="!isLoggedIn">
      <a routerLink="/login" (click)="toggleMenu()" class="block text-sm font-semibold"> Login </a>

      <a
        routerLink="/signup"
        (click)="toggleMenu()"
        class="block bg-green-700 text-white text-center py-2 rounded-lg text-sm font-semibold"
      >
        Sign Up
      </a>
    </div>

    <div class="pt-4 border-t space-y-2" *ngIf="isLoggedIn">
      <button
        type="button"
        (click)="goToPurchaseCart()"
        class="w-full flex items-center justify-between text-sm font-semibold py-2"
      >
        <span><i class="fas fa-shopping-bag mr-2 text-green-700"></i>Purchase Cart</span>
        <span>{{ purchaseCartCount }}</span>
      </button>

      <button
        type="button"
        (click)="goToRentalCart()"
        class="w-full flex items-center justify-between text-sm font-semibold py-2"
      >
        <span><i class="fas fa-campground mr-2 text-green-700"></i>Rental Cart</span>
        <span>{{ rentalCartCount }}</span>
      </button>

      <a routerLink="/customer" (click)="toggleMenu()" class="block text-sm font-semibold py-2">
        <i class="fas fa-user mr-2 text-green-700"></i>
        My Profile
      </a>

      <button
        type="button"
        routerLink="/customer/orders"
        class="w-full flex items-center gap-3 px-5 py-3 text-gray-700 hover:bg-green-50 hover:text-green-700 transition text-left"
      >
        <i class="fas fa-box text-green-700"></i>
        <span>My Orders</span>
      </button>

      <button
        type="button"
        routerLink="/customer/rentals"
        class="w-full flex items-center gap-3 px-5 py-3 text-gray-700 hover:bg-green-50 hover:text-green-700 transition text-left"
      >
        <i class="fas fa-campground text-green-700"></i>
        <span>My Rentals</span>
      </button>
     

      <button
        type="button"
        (click)="onLogout()"
        class="w-full bg-red-600 text-white py-2 rounded-lg text-sm font-semibold"
      >
        Logout
      </button>
    </div>
  </div>
</header>
