<!-- HERO -->
<section class="relative h-[420px] bg-cover bg-center"
  style="background-image:url('images/hero2.png')">
  <div class="absolute inset-0 bg-black/40"></div>

  <div class="relative z-10 max-w-7xl mx-auto px-6 h-full flex items-center">
    <div class="text-white">
      <h1 class="text-4xl font-serif">Tent Rentals</h1>
      <p class="text-sm mt-2">
        Choose from our premium collection of camping tents
      </p>
    </div>
  </div>
</section>

<!-- SEARCH -->
<section class="bg-gray-100 py-10">
  <div class="max-w-5xl mx-auto bg-white p-6 rounded shadow grid md:grid-cols-4 gap-4">
    <div>
      <label class="block text-sm text-gray-700 mb-1">Start date</label>
      <input type="date" [(ngModel)]="checkIn" class="border px-3 py-2 rounded w-full" />
    </div>
    <div>
      <label class="block text-sm text-gray-700 mb-1">End date</label>
      <input type="date" [(ngModel)]="checkOut" class="border px-3 py-2 rounded w-full" />
    </div>
    <button (click)="search()" class="md:col-span-2 bg-green-700 text-white py-2 rounded hover:bg-green-800">Search</button>
  </div>
</section>

<!-- TENTS -->
<section class="py-16 bg-gray-50">
  <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-3 gap-8">

    <div *ngFor="let tent of tents"
         class="bg-white p-6 rounded shadow">

      <span
        class="text-xs px-3 py-1 rounded-full"
        [ngClass]="tent.available
          ? 'bg-green-100 text-green-700'
          : 'bg-red-100 text-red-700'">
        {{ tent.available ? 'Available' : 'Booked' }}
      </span>

      <img [src]="tent.img" class="h-36 mx-auto my-4" />

      <h3 class="text-center font-semibold">
        {{ tent.name }}
      </h3>

      <p class="text-center text-green-700 font-bold mt-2">
        LKR {{ tent.price }} / day
      </p>

      <button
        (click)="bookTent(tent)"
        [disabled]="!tent.available"
        class="mt-4 w-full py-2 rounded text-white"
        [ngClass]="tent.available
          ? 'bg-green-700 hover:bg-green-800'
          : 'bg-gray-400 cursor-not-allowed'">
        Book Now
      </button>

    </div>
  </div>
</section>
