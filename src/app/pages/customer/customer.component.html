<div class="max-w-2xl mx-auto mt-32 bg-white shadow-lg rounded-xl p-8">
  <h2 class="text-2xl font-semibold mb-6 text-green-700">My Profile</h2>

  <div class="space-y-4">
    <div>
      <label>First Name</label>
      <input [(ngModel)]="profile.firstName" class="w-full border rounded-md px-3 py-2"/>
    </div>

    <div>
      <label>Last Name</label>
      <input [(ngModel)]="profile.lastName" class="w-full border rounded-md px-3 py-2"/>
    </div>

    <div>
      <label>Email</label>
      <input [(ngModel)]="profile.email" disabled class="w-full border px-3 py-2 bg-gray-100"/>
    </div>

    <div>
      <label>Phone</label>
      <input [(ngModel)]="profile.phone" class="w-full border rounded-md px-3 py-2"/>
    </div>

    <button (click)="saveProfile()" class="bg-green-700 text-white px-6 py-2 rounded-md">
      Save Changes
    </button>

    <p class="text-green-600 mt-3" *ngIf="message">{{ message }}</p>
  </div>
</div>
