<section class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow p-8 max-w-md w-full text-center">
    <div class="w-16 h-16 bg-yellow-100 text-yellow-700 rounded-full flex items-center justify-center mx-auto mb-4">
      <i class="fas fa-clock text-2xl"></i>
    </div>

    <h1 class="text-2xl font-bold text-gray-800">Payment Not Completed</h1>

    <p class="text-gray-500 mt-3">
      Your order was created, but payment was not completed.
    </p>

    <a
      *ngIf="orderId"
      [routerLink]="['/order-summary', orderId]"
      class="block mt-6 bg-green-700 hover:bg-green-800 text-white py-3 rounded-xl font-semibold"
    >
      View Order
    </a>

    <a
      routerLink="/customer/orders"
      class="block mt-3 border border-gray-300 text-gray-700 py-3 rounded-xl font-semibold"
    >
      My Orders
    </a>
  </div>
</section>
