<div class="min-h-screen bg-gray-900 flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-8">

    <h2 class="text-2xl font-semibold text-[#0F5D2F] mb-1">Reset Password</h2>
    <p class="text-sm text-gray-600 mb-6">Enter your email and we'll send you a reset link.</p>

    <!-- SUCCESS -->
    <div *ngIf="successMessage"
         class="flex items-start gap-2 bg-green-50 border border-green-200 text-green-800 rounded px-3 py-3 mb-4 text-sm"
         role="status">
      <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-width="2" d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline stroke-width="2" points="22 4 12 14.01 9 11.01"/>
      </svg>
      <span>{{ successMessage }}</span>
    </div>

    <!-- ERROR -->
    <div *ngIf="errorMessage"
         class="flex items-start gap-2 bg-red-50 border border-red-200 text-red-700 rounded px-3 py-2 mb-4 text-sm"
         role="alert">
      <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke-width="2"/>
        <line x1="12" y1="8" x2="12" y2="12" stroke-width="2"/>
        <line x1="12" y1="16" x2="12.01" y2="16" stroke-width="2"/>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form *ngIf="!successMessage"
          (ngSubmit)="sendResetLink(forgotForm)" #forgotForm="ngForm" novalidate>

      <label class="block text-sm mb-1">Email</label>
      <input type="email" name="email" [(ngModel)]="email"
             required email #emailCtrl="ngModel"
             placeholder="you@example.com"
             [class]="'w-full border rounded px-3 py-2 mb-0.5 outline-none transition-colors text-sm ' +
               (emailCtrl.invalid && emailCtrl.touched
                 ? 'border-red-400 bg-red-50' : 'border-gray-300 focus:border-[#0F5D2F]')" />
      <div class="min-h-[18px] mb-4">
        <p *ngIf="emailCtrl.touched && emailCtrl.hasError('required')"
           class="text-red-600 text-xs">Email is required</p>
        <p *ngIf="emailCtrl.touched && emailCtrl.hasError('email') && !emailCtrl.hasError('required')"
           class="text-red-600 text-xs">Please enter a valid email address</p>
      </div>

      <button type="submit" [disabled]="loading"
              class="w-full bg-[#0F5D2F] text-white py-2 rounded hover:bg-[#0d4f28] transition-colors
                     disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <svg *ngIf="loading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        {{ loading ? 'Sending…' : 'Send Reset Link' }}
      </button>

      <p class="text-xs text-center mt-4">
        Remember your password?
        <a routerLink="/login" class="text-[#0F5D2F] hover:underline font-medium">Login</a>
      </p>

    </form>

  </div>
</div>
