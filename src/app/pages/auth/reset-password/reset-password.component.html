<div class="min-h-screen bg-gray-900 flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-8">

    <h2 class="text-2xl font-semibold text-[#0F5D2F] mb-1">Reset Password</h2>
    <p class="text-sm text-gray-600 mb-6">Enter and confirm your new password below.</p>

    <!-- SUCCESS -->
    <div *ngIf="successMessage"
         class="flex items-start gap-2 bg-green-50 border border-green-200 text-green-800 rounded px-3 py-3 text-sm"
         role="status">
      <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-width="2" d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline stroke-width="2" points="22 4 12 14.01 9 11.01"/>
      </svg>
      <div>
        <p class="font-semibold">{{ successMessage }}</p>
        <p class="text-green-700 mt-0.5">Redirecting you to login…</p>
      </div>
    </div>

    <!-- ERROR -->
    <div *ngIf="errorMessage && !successMessage"
         class="flex items-start gap-2 bg-red-50 border border-red-200 text-red-700 rounded px-3 py-3 mb-4 text-sm"
         role="alert">
      <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke-width="2"/>
        <line x1="12" y1="8" x2="12" y2="12" stroke-width="2"/>
        <line x1="12" y1="16" x2="12.01" y2="16" stroke-width="2"/>
      </svg>
      <div>
        <p>{{ errorMessage }}</p>
        <a *ngIf="tokenMissing" routerLink="/forgot-password"
           class="text-[#0F5D2F] underline font-medium mt-1 inline-block">
          Request new reset link →
        </a>
      </div>
    </div>

    <form *ngIf="!successMessage && !tokenMissing"
          (ngSubmit)="resetPassword(resetForm)" #resetForm="ngForm" novalidate>

      <!-- NEW PASSWORD -->
      <label class="block text-sm mb-1">New Password</label>
      <div class="relative">
        <input [type]="showPassword ? 'text' : 'password'"
               name="password" [(ngModel)]="password"
               required minlength="8" #passwordCtrl="ngModel"
               placeholder="Enter new password"
               (input)="onPasswordInput()"
               [class]="'w-full border rounded px-3 py-2 pr-10 outline-none transition-colors text-sm ' +
                 (passwordCtrl.invalid && passwordCtrl.touched
                   ? 'border-red-400 bg-red-50' : 'border-gray-300 focus:border-[#0F5D2F]')" />
        <button type="button" (click)="showPassword = !showPassword"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
          <svg *ngIf="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-width="1.8" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3" stroke-width="1.8"/>
          </svg>
          <svg *ngIf="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-width="1.8" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23" stroke-width="1.8"/>
          </svg>
        </button>
      </div>
      <div *ngIf="password" class="flex gap-1 mt-1.5">
        <div *ngFor="let i of [1,2,3,4]" class="h-1 flex-1 rounded-full transition-all duration-300"
             [class]="passwordStrength >= i ? strengthBarClass : 'bg-gray-200'"></div>
      </div>
      <div class="min-h-[18px] mt-0.5 mb-4">
        <p *ngIf="password && !passwordCtrl.invalid" [class]="'text-xs ' + strengthColorClass">{{ strengthLabel }}</p>
        <p *ngIf="passwordCtrl.touched && passwordCtrl.hasError('required')" class="text-red-600 text-xs">Password is required</p>
        <p *ngIf="passwordCtrl.touched && passwordCtrl.hasError('minlength')" class="text-red-600 text-xs">Password must be at least 8 characters</p>
      </div>

      <!-- CONFIRM PASSWORD -->
      <label class="block text-sm mb-1">Confirm Password</label>
      <div class="relative">
        <input [type]="showConfirmPassword ? 'text' : 'password'"
               name="confirmPassword" [(ngModel)]="confirmPassword"
               required #confirmCtrl="ngModel"
               placeholder="Repeat new password"
               (input)="onConfirmInput()"
               [class]="'w-full border rounded px-3 py-2 pr-10 outline-none transition-colors text-sm ' +
                 ((confirmCtrl.touched && confirmCtrl.hasError('required')) || passwordMismatch
                   ? 'border-red-400 bg-red-50' : 'border-gray-300 focus:border-[#0F5D2F]')" />
        <button type="button" (click)="showConfirmPassword = !showConfirmPassword"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
          <svg *ngIf="!showConfirmPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-width="1.8" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3" stroke-width="1.8"/>
          </svg>
          <svg *ngIf="showConfirmPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-width="1.8" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23" stroke-width="1.8"/>
          </svg>
        </button>
      </div>
      <div class="min-h-[18px] mt-0.5 mb-6">
        <p *ngIf="confirmCtrl.touched && confirmCtrl.hasError('required')" class="text-red-600 text-xs">Please confirm your password</p>
        <p *ngIf="passwordMismatch && !confirmCtrl.hasError('required')" class="text-red-600 text-xs">Passwords do not match</p>
      </div>

      <button type="submit" [disabled]="loading"
              class="w-full bg-[#0F5D2F] text-white py-2 rounded hover:bg-[#0d4f28] transition-colors
                     disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <svg *ngIf="loading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        {{ loading ? 'Updating…' : 'Reset Password' }}
      </button>

    </form>
  </div>
</div>
