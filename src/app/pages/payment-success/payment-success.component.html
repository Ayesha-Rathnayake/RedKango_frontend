<section class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow p-8 max-w-md w-full text-center">
    <div
      class="w-16 h-16 bg-green-100 text-green-700 rounded-full flex items-center justify-center mx-auto mb-4"
    >
      <i class="fas fa-check text-2xl"></i>
    </div>

    <h1 class="text-2xl font-bold text-gray-800">Payment Successful</h1>

    <p class="text-gray-500 mt-3">
      Thank you. Your payment has been completed successfully.
    </p>

    <!-- PURCHASE ORDER BUTTON -->
    <a
      *ngIf="!isRentalPayment && orderId"
      [routerLink]="['/order-summary', orderId]"
      class="block mt-6 bg-green-700 hover:bg-green-800 text-white py-3 rounded-xl font-semibold"
    >
      View Order
    </a>

    <!-- RENTAL BOOKING BUTTON -->
    <a
      *ngIf="isRentalPayment"
      routerLink="/customer/rentals"
      class="block mt-6 bg-green-700 hover:bg-green-800 text-white py-3 rounded-xl font-semibold"
    >
      View Rental Booking
    </a>

    <!-- PURCHASE ORDERS -->
    <a
      *ngIf="!isRentalPayment"
      routerLink="/customer/orders"
      class="block mt-3 border border-gray-300 text-gray-700 py-3 rounded-xl font-semibold"
    >
      My Orders
    </a>

    <!-- RENTALS -->
    <a
      *ngIf="isRentalPayment"
      routerLink="/customer/rentals"
      class="block mt-3 border border-gray-300 text-gray-700 py-3 rounded-xl font-semibold"
    >
      My Rentals
    </a>
  </div>
</section>
